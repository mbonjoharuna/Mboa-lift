{% extends "base.html" %}
{% block title %}Driver Login - MboaLift{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Driver Login</h1>
    <p class="auth-subtitle">Access your driver account</p>

    <form method="POST" action="{{ url_for('driver_login') }}" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Your password">
        </div>

        <button type="submit" class="btn-primary btn-block">Login as Driver</button>
    </form>

    <p class="auth-footer">
        New driver? <a href="{{ url_for('driver_register') }}">Register</a><br>
        Rider? <a href="{{ url_for('login') }}">Rider Login</a>
    </p>
</div>
{% endblock %}
