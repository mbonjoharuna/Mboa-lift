{% extends "base.html" %}
{% block title %}Rate Ride - MboaLift{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Rate Your Ride</h1>
    <p>Ride #{{ ride_id }}</p>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('rate_ride', ride_id=ride_id) }}">
        <div class="form-group">
            <label>Rating (1–5)</label>
            <div class="rating-stars">
                {% for i in range(1, 6) %}
                <label class="star-label">
                    <input type="radio" name="rating" value="{{ i }}" required>
                    <span>{{ i }} ★</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label for="comment">Comment (optional)</label>
            <textarea id="comment" name="comment" rows="4"
                      placeholder="Share your experience..."></textarea>
        </div>

        <button type="submit" class="btn-primary btn-block">Submit Rating</button>
    </form>
</div>
{% endblock %}
