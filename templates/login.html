{% extends "base.html" %}
{% block title %}Login - MboaLift{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to your MboaLift account</p>

    <form method="POST" action="{{ url_for('login') }}" id="loginForm" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Your password">
        </div>

        <button type="submit" class="btn-primary btn-block">Login</button>
    </form>

    <p class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Register as Rider</a><br>
        Are you a driver? <a href="{{ url_for('driver_login') }}">Driver Login</a>
    </p>
</div>
{% endblock %}
