<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" role="img" aria-label="MboaLift - Douala Mobility">
  <defs>
    <linearGradient id="fullGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#F97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (Dark Card) -->
  <g transform="translate(10, 6)">
    <rect width="118" height="118" rx="26" fill="#0F172A"/>
    <!-- Subtle Route Dash -->
    <path d="M12 36 Q 44 42, 58 20 T 106 32" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.5"/>
    <!-- Dynamic 'M' + Lift Arrow -->
    <g filter="url(#fullGlow)">
      <path d="M22 82 C 18 74 20 58 32 46 C 42 36 50 40 56 54 L 62 66 C 54 72 42 80 32 82 Z" fill="url(#fullGrad)"/>
      <path d="M18 80 C 32 88 50 76 66 62 L 78 50 C 82 46 88 40 96 32" stroke="url(#fullGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <polygon points="98,18 78,24 88,34 70,52 80,62 98,44 108,54" fill="url(#fullGrad)"/>
    </g>
    <circle cx="30" cy="80" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography: MboaLift -->
  <g transform="translate(148, 20)">
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#0F172A" letter-spacing="-1.5">
      Mboa<tspan fill="url(#fullGrad)">Lift</tspan>
    </text>
    
    <!-- Subtitle pill badge -->
    <g transform="translate(2, 70)">
      <rect width="180" height="24" rx="12" fill="#FEF3C7" opacity="0.9"/>
      <circle cx="14" cy="12" r="4" fill="#D97706"/>
      <text x="26" y="16.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#92400E" letter-spacing="1.5">
        DOUALA MOBILITY
      </text>
    </g>
  </g>
</svg>
