<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MboaLift Logo">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- Primary Vibrant Mboa Gold to Coral Gradient -->
    <linearGradient id="goldOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Dynamic Lift Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Subtle Road Trace Gradient -->
    <linearGradient id="roadGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#F97316" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Subtle Urban Route Accent Grid Lines -->
  <path d="M14 36 Q 48 42, 64 20 T 114 32" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
  <path d="M18 100 Q 52 88, 80 110 T 120 90" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
  <circle cx="64" cy="20" r="2.5" fill="#38BDF8" opacity="0.7"/>

  <!-- Main Dynamic 'M' + Lift Arrow Mark -->
  <g filter="url(#glow)">
    <!-- Left Ribbon Arch of the 'M' -->
    <path d="M26 88 C 21 82 23 64 36 50 C 47 38 56 42 62 56 L 68 70 C 60 76 46 86 36 88 Z" 
          fill="url(#goldOrange)"/>

    <!-- Dynamic Road Swoop / Highway Wave -->
    <path d="M22 86 C 36 94 56 82 72 68 L 84 56 C 88 52 94 46 102 38" 
          stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Right Pillar & Upward Mobility Arrow -->
    <!-- The arrow soars upward at 45 degrees -->
    <path d="M60 62 C 68 46 76 34 88 28 L 82 46 L 72 74 C 70 80 74 92 84 96 C 88 98 94 94 96 90 L 98 84 L 88 82 C 82 80 80 74 82 68 L 90 48" 
          fill="url(#goldOrange)"/>

    <!-- Dynamic Bold Arrowhead (Lift) -->
    <polygon points="106,20 84,26 95,37 75,57 85,67 105,47 116,58" fill="url(#arrowGrad)"/>
    
    <!-- Speed line highlight on arrow head -->
    <path d="M88 30 L 103 24 L 97 39" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Speed Dash / White Accent -->
  <path d="M42 68 C 48 60 56 62 62 72" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  <circle cx="34" cy="85" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>
